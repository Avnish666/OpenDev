
name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: opendev_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d opendev_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/opendev_test_ci
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/opendev_test_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-app.txt
            backend/requirements-payments.txt
            backend/requirements-dev.txt

      - name: Install local OCR runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Migrate isolated test database
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Check migration consistency
        working-directory: backend
        run: python -m alembic check

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend integration tests and lint
        working-directory: frontend
        run: npm test && npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
